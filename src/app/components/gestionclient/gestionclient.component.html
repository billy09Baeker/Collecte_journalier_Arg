<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    
    main {
      background-color: #f5f3f3;
      min-height: 100vh;
      padding: 20px;
    }
    
    .navbar {
      display: flex;
      align-items: center;
      background-color: #2152b9;
      padding: 15px 20px;
      color: white;
    }
    
    .logo {
      display: flex;
      align-items: center;
      font-size: 22px;
      margin-right: 40px;
    }
    
    .nav-links {
      display: flex;
      flex-grow: 1;
    }
    
    .nav-link {
      margin-right: 20px;
      color: #ddd;
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    
    .logout {
      color: #f8bf40;
      text-decoration: none;
      display: flex;
      align-items: center;
    }
  
    .header-section {
      padding: 20px 0;
    }
  
    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 20px;
    }
  
    .table-container {
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
  
    .clients-table {
      width: 100%;
      border-collapse: collapse;
    }
  
    .clients-table th {
      background-color: #f9f9f9;
      color: #333;
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
  
    .clients-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      color: #333;
    }
  
    .action-buttons {
      display: flex;
      gap: 10px;
    }
  
    .btn-details {
      background-color: #f0f0f0;
      border: none;
      color: #333;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
  
    .btn-delete {
      background-color: #f0f0f0;
      border: none;
      color: #d9534f;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
  
    .footer-section {
      margin-top: 20px;
      padding: 15px;
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
    }
  
    .about-section, .navigation-section, .contact-section {
      flex: 1;
      padding: 0 15px;
    }
  
    .social-icons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
  
  <nav class="navbar">
    <div class="logo">
      <span>📁 MaCollecte</span>
    </div>
    <div class="nav-links">
      <a routerLink="/" class="nav-link">📊 Tableau de bord</a>
      <a routerLink="/collectes" class="nav-link">📑 Collectes</a>
      <a routerLink="/clients" class="nav-link">👤 Clients</a>
      <a routerLink="/paiements" class="nav-link">💰 Paiements</a>
    </div>
    <a routerLink="/logout" class="logout">🔓 Déconnexion</a>
  </nav>
  
  <main>
    <div class="header-section">
      <h1>Gestion des Clients</h1>
    </div>
    
    <div class="table-container">
      <table class="clients-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Sexe</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Solde (FCFA)</th>
            <th>Détails</th>
            <th>Supprimer</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of clients">
            <td>{{ client.nom }}</td>
            <td>{{ client.prenom }}</td>
            <td>{{ client.sexe }}</td>
            <td>{{ client.email }}</td>
            <td>{{ client.telephone }}</td>
            <td>{{ client.solde }}</td>
            <td>
              <button class="btn-details" (click)="viewDetails(client.id)">
                <span>⚙️</span>
              </button>
            </td>
            <td>
              <button class="btn-delete" (click)="deleteClient(client.id)">
                <span>🗑️</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
